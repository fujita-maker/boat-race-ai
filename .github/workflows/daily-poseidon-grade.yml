name: daily-poseidon-grade

# レース後に「ポセイドンを最終オッズ込みで再取得 → 1号艇軸+高オッズ+EVプラスで6-8点選定 → 実結果で精算」。
#  data/poseidon/{hd}.json を更新し、data/poseidon_ledger.csv に通算成績を追記。
#  手動実行で過去日(例 20260820)も採点可 → 完了日で初回結果が見られる。

on:
  schedule:
    - cron: "40 14 * * *"      # 14:40 UTC = 23:40 JST(全レース終了後)
  workflow_dispatch:
    inputs:
      hd:
        description: "対象日 YYYYMMDD(空なら当日JST)"
        required: false
        default: ""
      odds_min:
        description: "高オッズ足切り(既定20)"
        required: false
        default: "20"
      ev_min:
        description: "EV下限(既定1.0)"
        required: false
        default: "1.0"
      points:
        description: "1レース最大点数(既定8)"
        required: false
        default: "8"

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests numpy beautifulsoup4 lxml
      # v69: 定時実行は数時間遅れて日付(JST)をまたぐことがある。hd空欄を「JST現在」にすると
      #   終わった当日ではなく翌日(レース前・オッズ無し)を取ってしまい、8/30以降オッズが入っていなかった。
      #   → 空欄時は「JST現在−6時間」の日付を対象にする(23:40でも翌04:00でも同じ日になる)。
      - name: Decide target date
        run: |
          HD="${{ github.event.inputs.hd }}"
          if [ -z "$HD" ]; then HD=$(TZ=Asia/Tokyo date -d '-6 hours' +%Y%m%d); fi
          echo "HD=$HD" >> "$GITHUB_ENV"
          echo "対象日: $HD"
      - name: Re-scrape with final odds (確率はレース前の値を保持)
        run: python poseidon_scrape.py --hd "$HD" --out data/poseidon --merge
      - name: Grade (1号艇軸+高オッズ+EV)
        run: |
          python poseidon_grade.py --hd "$HD" \
            --ledger data/poseidon_ledger.csv \
            --odds-min "${{ github.event.inputs.odds_min || '20' }}" \
            --ev-min "${{ github.event.inputs.ev_min || '1.0' }}" \
            --points "${{ github.event.inputs.points || '8' }}"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/poseidon data/poseidon_ledger.csv
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "poseidon grade: $HD"
            git push
          fi
