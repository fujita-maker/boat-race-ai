name: collect-odds
on:
  workflow_dispatch:
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: echo '' | base64 -d > collect_odds.py
      - run: python collect_odds.py --targets targets.csv --out odds.csv --workers 4 --sleep 1.2
      - uses: actions/upload-artifact@v4
        with:
          name: odds
          path: odds.csv
