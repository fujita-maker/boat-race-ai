name: backfill-poseidon-odds

# v69(2026-09-16): ポセイドンの「最終オッズ・海神指数」を過去日ぶん取り直す(一回きりの手動実行用)。
#  目的: C案(中オッズEV)の厳選候補を、ライブ以外の別期間(8/21〜)で検証するため。
#  ・data/poseidon/{日付}.json の AI予想確率(前夜取得=前向き検証の正本)は上書きしない(--merge)。
#  ・既にオッズが入っているレースは取りに行かない(--only-missing-odds)＝途中で止まっても再実行で続きから。
#  ・1日ごとにコミットするので、途中で時間切れになってもそこまでの分は残る。
#  所要: 1日あたり約150レース×約1秒 ≒ 3分 → 26日で約1.5時間。

on:
  workflow_dispatch:
    inputs:
      from:
        description: "開始日 YYYYMMDD"
        required: false
        default: "20260821"
      to:
        description: "終了日 YYYYMMDD(空なら昨日JST)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: poseidon-odds
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Backfill day by day
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FROM="${{ github.event.inputs.from }}"; FROM=${FROM:-20260821}
          TO="${{ github.event.inputs.to }}"
          if [ -z "$TO" ]; then TO=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y%m%d); fi
          d="$FROM"
          while [ "$d" -le "$TO" ]; do
            if [ -f "data/poseidon/$d.json" ]; then
              echo "=== $d ==="
              python poseidon_scrape.py --hd "$d" --out data/poseidon --merge --only-missing-odds --sleep 0.4 || echo "!! $d 失敗(次へ)"
              git add "data/poseidon/$d.json"
              if ! git diff --cached --quiet; then
                git commit -m "poseidon odds backfill: $d"
                for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
              fi
            else
              echo "=== $d: 前夜の確率ファイルが無いのでスキップ(後から取った確率はレース前の値と保証できない) ==="
            fi
            d=$(date -d "$d + 1 day" +%Y%m%d)
          done
      - name: Summary
        run: |
          python - <<'PY'
          import json, glob, os
          for f in sorted(glob.glob("data/poseidon/2026*.json")):
              j = json.load(open(f))
              n = len(j); w = sum(1 for v in j.values() if isinstance(v, dict) and any(isinstance(c, list) and len(c) > 1 and c[1] is not None for c in v.values()))
              print(os.path.basename(f), f"{w}/{n} レースにオッズ")
          PY
