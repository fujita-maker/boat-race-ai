name: daily-autorun

# 毎日自動で「予想 → 結果照合 → 台帳へ追記(永続)」を実行する。
#  1) Renderアプリの autorun を「1場ずつ」叩く(13場)。1回が短いのでタイムアウトしない。
#     各場: 確定レースを走査 → ゲート(自信度×本命の抜け)通過の 1-4/1-5・高オッズ(>=20倍)
#           EV>=1.20 を締切時オッズ+結果で即精算し、records(JSON)で返す。
#  2) 全場の records を data/ho_ledger.csv に追記(重複は除外)。台帳はGitHub側に永続。
#  3) 通算(投資・払戻・的中率・回収率)を Actions ログに表示。
#
# 手動実行可(Run workflow)。過去日を埋めたいときは hd に YYYYMMDD を入れる。

on:
  schedule:
    - cron: "0 14 * * *"      # 14:00 UTC = 23:00 JST(その日の全レース終了後)
  workflow_dispatch:
    inputs:
      hd:
        description: "対象日 YYYYMMDD(空なら当日JST)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  autorun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wake Render (free plan sleeps)
        run: |
          BASE="https://boat-race-ai-cxwk.onrender.com"
          curl -s -m 90 "$BASE/" -o /dev/null || true
          sleep 20

      - name: Call autorun per venue
        run: |
          BASE="https://boat-race-ai-cxwk.onrender.com"
          HD="${{ github.event.inputs.hd }}"
          VENUES="1 2 3 4 5 6 7 8 12 16 21 22 24"
          mkdir -p resp
          for V in $VENUES; do
            URL="$BASE/api/highodds/autorun?jcd=$V"
            if [ -n "$HD" ]; then URL="$URL&hd=$HD"; fi
            ok=0
            for i in 1 2 3; do
              code=$(curl -s -m 150 -w '%{http_code}' -o "resp/$V.json" "$URL")
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "venue $V attempt $i -> HTTP $code (retry)"
              sleep 15
            done
            if [ "$ok" = "1" ]; then
              logged=$(python -c "import json;print(json.load(open('resp/$V.json')).get('今回記録',0))" 2>/dev/null || echo "?")
              echo "venue $V OK  今回記録=$logged"
            else
              echo "venue $V FAILED (skip)"
              rm -f "resp/$V.json"
            fi
            sleep 2
          done

      - name: Merge records into durable ledger
        run: |
          python - <<'PY'
          import json, csv, os, glob
          cols = ["ts","date","jcd","rno","combo","P","odds","market_p","EV","stake","status","payout","ret","hit","star","women"]
          path = "data/ho_ledger.csv"
          os.makedirs("data", exist_ok=True)
          rows = []
          if os.path.exists(path):
              rows = list(csv.DictReader(open(path, newline="", encoding="utf-8")))
          seen = {(r["date"], r["jcd"], r["rno"], r["combo"]) for r in rows}
          added = 0
          for fp in sorted(glob.glob("resp/*.json")):
              try:
                  d = json.load(open(fp))
              except Exception:
                  continue
              c = d.get("cols") or cols
              for r in (d.get("records") or []):
                  k = (str(r["date"]), str(r["jcd"]), str(r["rno"]), str(r["combo"]))
                  if k in seen:
                      continue
                  seen.add(k)
                  rows.append({col: r.get(col, "") for col in c})
                  added += 1
          rows.sort(key=lambda r: (str(r["date"]), int(r["jcd"]), int(r["rno"]), str(r["combo"])))
          with open(path, "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=cols); w.writeheader(); w.writerows(rows)
          s = [r for r in rows if r.get("status") == "settled"]
          stk = sum(float(r["stake"]) for r in s)
          ret = sum(float(r["ret"] or 0) for r in s)
          h   = sum(int(float(r["hit"] or 0)) for r in s)
          roi = (ret/stk*100) if stk else 0
          print(f"追記 {added}行 / 台帳合計 {len(rows)}行")
          print(f"通算: 精算{len(s)}買い目 的中{h}({(h/len(s)*100 if s else 0):.1f}%) "
                f"投資{stk:,.0f}円 払戻{ret:,.0f}円 純益{ret-stk:,.0f}円 回収率{roi:.1f}%")
          PY

      - name: Commit ledger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ho_ledger.csv
          if git diff --cached --quiet; then
            echo "変更なし(新規記録なし)"
          else
            git commit -m "daily ledger: ${{ github.event.inputs.hd }}$(date -u +' %Y-%m-%d')"
            git push
          fi
