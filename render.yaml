services:
  - type: web
    name: boat-race-ai-v30
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    # 予想・結果データを再起動後も保持するための永続ディスク(約¥数十/月)。
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
