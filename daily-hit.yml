name: daily-hit

# 2連単「当てにいく」特化システム（高オッズ系 daily-autorun とは別建て）。
#  hit_daily.py が api/v1 から直近120日を学習(GBM)→当日を予想(上位3点)→着順で精算し、
#  data/hit_ledger.csv に追記。高オッズの ho_ledger.csv とは別ファイルで管理。
#
# 手動実行可(Run workflow)。過去日は hd に YYYYMMDD。

on:
  schedule:
    - cron: "20 14 * * *"      # 14:20 UTC = 23:20 JST（高オッズ 14:00 とずらす）
  workflow_dispatch:
    inputs:
      hd:
        description: "対象日 YYYYMMDD(空なら当日JST)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  hit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install numpy scikit-learn requests
      - name: Run hit_daily (train + predict + settle)
        run: |
          python hit_daily.py --hd "${{ github.event.inputs.hd }}" --train-days 120 --topn 3 --ledger data/hit_ledger.csv
      - name: Commit ledger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hit_ledger.csv
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git pull --rebase origin main || true
            git commit -m "hit ledger: ${{ github.event.inputs.hd }}$(date -u +' %Y-%m-%d')"
            git push
          fi
